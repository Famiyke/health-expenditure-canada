name: Export updated workbook for numerical audit
on:
  push:
    paths: ['.github/workflows/export-workbook-qa.yml']
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: expenditure-workbook-review
          path: nhex_excel_workbook.xlsx
